<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Câmeras - Smart TV</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100vw;
      height: 100vh;
      background-color: #0d1117;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Barra superior discreta adaptada para controle remoto de Smart TV */
    #top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background-color: #161b22;
      border-bottom: 2px solid #30363d;
      height: 70px;
      flex-shrink: 0;
    }

    .title {
      font-size: 22px;
      font-weight: bold;
      color: #58a6ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .status-dot {
      width: 12px;
      height: 12px;
      background-color: #2ea043;
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px #2ea043;
    }

    .controls {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .btn {
      background-color: #21262d;
      color: #c9d1d9;
      border: 2px solid #30363d;
      padding: 10px 20px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    /* Destaque claro para navegação com setas do controle remoto da TV */
    .btn:focus, .btn:hover {
      outline: none;
      border-color: #58a6ff;
      background-color: #1f6feb;
      color: #ffffff;
      transform: scale(1.04);
    }

    .btn.active {
      background-color: #238636;
      border-color: #2ea043;
      color: #ffffff;
    }

    /* Área principal do vídeo */
    #video-container {
      flex: 1;
      width: 100%;
      height: calc(100vh - 70px);
      background-color: #000000;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Modal de configuração direto pela TV ou celular */
    #config-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      z-index: 100;
    }

    .modal-box {
      background-color: #161b22;
      border: 2px solid #30363d;
      border-radius: 12px;
      padding: 28px;
      width: 90%;
      max-width: 680px;
    }

    .modal-box h2 {
      margin-bottom: 14px;
      font-size: 24px;
      color: #58a6ff;
    }

    .modal-box p {
      margin-bottom: 12px;
      font-size: 16px;
      color: #8b949e;
      line-height: 1.4;
    }

    .modal-box input {
      width: 100%;
      padding: 14px;
      font-size: 18px;
      background-color: #0d1117;
      border: 2px solid #30363d;
      color: #ffffff;
      border-radius: 8px;
      margin-bottom: 18px;
    }

    .modal-box input:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
    }
  </style>
</head>
<body>

  <header id="top-bar">
    <div class="title">
      <span class="status-dot"></span>
      <span>Câmeras Yoosee - Smart TV</span>
    </div>
    <div class="controls">
      <button class="btn active" id="btn-cam1" onclick="loadCam(1)" tabindex="1">Câmera 1</button>
      <button class="btn" id="btn-cam2" onclick="loadCam(2)" tabindex="2">Câmera 2</button>
      <button class="btn" onclick="reloadStream()" tabindex="3">Recarregar</button>
      <button class="btn" onclick="toggleFullScreen()" tabindex="4">Tela Cheia</button>
      <button class="btn" onclick="openConfig()" tabindex="5">Configurar Link</button>
    </div>
  </header>

  <main id="video-container">
    <iframe 
      id="cam-frame"
      src="" 
      allow="autoplay; fullscreen" 
      allowfullscreen>
    </iframe>
  </main>

  <div id="config-modal">
    <div class="modal-box">
      <h2>Configurar Link da Câmera</h2>
      <p>Cole abaixo o <b>Link Web (https://...)</b> do player gerado no <b>IPCamLive</b> ou <b>RTSP.me</b>, ou digite apenas o código <b>Alias</b> do IPCamLive:</p>
      <input type="text" id="input-cam1" placeholder="Ex: https://rtsp.me/embed/XXXXXXX/ ou Alias do IPCamLive">
      <input type="text" id="input-cam2" placeholder="Link ou Alias da Câmera 2 (Opcional)">
      <div class="modal-actions">
        <button class="btn" onclick="closeConfig()">Cancelar</button>
        <button class="btn active" onclick="saveConfig()">Salvar e Abrir</button>
      </div>
    </div>
  </div>

  <script>
    // =========================================================================
    // CONFIGURAÇÃO FIXA NO CÓDIGO:
    // Substitua "SEU_ALIAS_AQUI" pelo código Alias do IPCamLive ou pela URL https://...
    // =========================================================================
    const DEFAULT_CAM_1 = "https://ipcamlive.com/player/player.php?alias=SEU_ALIAS_AQUI&autoplay=1&mute=1";
    const DEFAULT_CAM_2 = "https://ipcamlive.com/player/player.php?alias=SEU_ALIAS_CAM2&autoplay=1&mute=1";

    let currentCam = 1;

    function extractAndFormatUrl(input) {
      if (!input) return "";
      input = input.trim();

      // Caso o usuário tenha colado o código <iframe src="..."> inteiro por engano, extrai apenas o src
      const srcMatch = input.match(/src=["']([^"']+)["']/i);
      if (srcMatch && srcMatch[1]) {
        input = srcMatch[1].trim();
      }

      // Se o usuário digitou apenas o código Alias do IPCamLive (ou o link curto ipcamlive.com/CODIGO)
      const shortIpCamMatch = input.match(/^https?:\/\/(?:www\.)?ipcamlive\.com\/([a-zA-Z0-9]+)$/i);
      if (shortIpCamMatch && shortIpCamMatch[1]) {
        return "https://ipcamlive.com/player/player.php?alias=" + shortIpCamMatch[1] + "&autoplay=1&mute=1";
      }

      if (!input.startsWith("http://") && !input.startsWith("https://")) {
        return "https://ipcamlive.com/player/player.php?alias=" + input + "&autoplay=1&mute=1";
      }

      return input;
    }

    function getCamUrl(camNumber) {
      const saved = localStorage.getItem("yoosee_tv_cam_" + camNumber);
      if (saved && saved.trim() !== "") {
        return extractAndFormatUrl(saved);
      }
      return camNumber === 1 ? DEFAULT_CAM_1 : DEFAULT_CAM_2;
    }

    function loadCam(camNumber) {
      currentCam = camNumber;
      const frame = document.getElementById("cam-frame");
      const url = getCamUrl(camNumber);

      document.getElementById("btn-cam1").classList.toggle("active", camNumber === 1);
      document.getElementById("btn-cam2").classList.toggle("active", camNumber === 2);

      if (url.includes("SEU_ALIAS")) {
        openConfig();
      } else {
        frame.src = url;
      }
    }

    function reloadStream() {
      const frame = document.getElementById("cam-frame");
      const currentSrc = frame.src;
      frame.src = "";
      setTimeout(() => {
        frame.src = currentSrc;
      }, 150);
    }

    function toggleFullScreen() {
      const elem = document.getElementById("video-container");
      if (!document.fullscreenElement) {
        if (elem.requestFullscreen) {
          elem.requestFullscreen();
        } else if (elem.webkitRequestFullscreen) {
          elem.webkitRequestFullscreen();
        }
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    function openConfig() {
      document.getElementById("input-cam1").value = localStorage.getItem("yoosee_tv_cam_1") || "";
      document.getElementById("input-cam2").value = localStorage.getItem("yoosee_tv_cam_2") || "";
      document.getElementById("config-modal").style.display = "flex";
      document.getElementById("input-cam1").focus();
    }

    function closeConfig() {
      document.getElementById("config-modal").style.display = "none";
    }

    function saveConfig() {
      const val1 = document.getElementById("input-cam1").value.trim();
      const val2 = document.getElementById("input-cam2").value.trim();
      if (val1) localStorage.setItem("yoosee_tv_cam_1", val1);
      if (val2) localStorage.setItem("yoosee_tv_cam_2", val2);
      closeConfig();
      loadCam(currentCam);
    }

    window.onload = function() {
      loadCam(1);
    };
  </script>
</body>
</html>
